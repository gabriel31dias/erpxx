<!doctype html>
<html lang="pt-BR" data-page="login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar na sua conta · LojaFlow</title>
<link rel="icon" href="/assets/images/favicon.png" type="image/x-icon">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#363afe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" type="text/css" href="/assets/css/font-awesome.css">
<link rel="stylesheet" type="text/css" href="/assets/css/vendors/icofont.css">
<link rel="stylesheet" type="text/css" href="/assets/css/vendors/themify.css">
<link rel="stylesheet" type="text/css" href="/assets/css/vendors/feather-icon.css">
<link rel="stylesheet" type="text/css" href="/assets/css/vendors/scrollbar.css">
<link rel="stylesheet" type="text/css" href="/assets/css/vendors/bootstrap.css">
<link rel="stylesheet" type="text/css" href="/assets/css/style.css">
<link id="color" rel="stylesheet" href="/assets/css/color-1.css" media="screen">
<link rel="stylesheet" type="text/css" href="/assets/css/responsive.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container-fluid p-0">
  <div class="row m-0">
    <div class="col-12 p-0">
      <div class="login-card login-dark">
        <div>
          <div><a class="logo lf-brand" href="/"><img src="/icons/brand-white.png" alt="Blue Vision" class="lf-logo"></a></div>
          <div class="login-main">
            <form class="theme-form" novalidate>
              <h4>Entrar na sua conta</h4>
              <p>Informe e-mail e senha para acessar a loja.</p>
              <div id="lf-alert" class="alert d-none" role="alert"></div>
              <div class="form-group">
                <label class="col-form-label" for="email">E-mail</label>
                <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                
              </div>
              <div class="form-group">
                <label class="col-form-label" for="password">Senha</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                
              </div>
              <div class="form-group mb-0">
                <div class="text-end mt-3"><button class="btn btn-primary btn-block w-100" type="submit">Entrar</button></div>
              </div>
              <p class="text-muted mt-3 mb-0 f-12">Demonstração: <strong>proprietaria@bompreco.com.br</strong> · senha <strong>senha1234</strong></p>
            </form>
            <p class="mt-4 mb-0 text-center"><a href="/esqueci-senha.html">Esqueci minha senha</a><span class="mx-2">·</span><a href="/cadastro.html">Cadastrar minha loja</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/assets/js/icons/feather-icon/feather.min.js"></script>
<script src="/assets/js/icons/feather-icon/feather-icon.js"></script>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
